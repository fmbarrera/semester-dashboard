# instead of `due_date`, so the demo always shows a realistic mix of
# overdue/upcoming/future items no matter when someone clones the repo.
# The loader resolves due_in_days -> an absolute due_date at seed time.
# Real data (assignments.local.yaml) always uses absolute due_date instead.

